<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0"><i class="bi bi-check2-square me-2"></i>To-Do List</h1>
          </div>

          <div class="card-body">
            <!-- Form tambah / edit -->
            <form id="todoForm" class="mb-4">
              <input type="hidden" id="editId" value="">
              <div class="input-group">
                <input type="text" id="todoInput" class="form-control" placeholder="Tulis tugas baru..." autocomplete="off" required>
                <button type="submit" id="submitBtn" class="btn btn-primary">
                  <i class="bi bi-plus-lg me-1"></i>Tambah
                </button>
                <button type="button" id="cancelBtn" class="btn btn-outline-secondary d-none">Batal</button>
              </div>
            </form>

            <div class="mb-3">
              <button type="button" id="dummyBtn" class="btn btn-outline-info btn-sm">
                <i class="bi bi-database-add me-1"></i>Buat 10 Data Dummy
              </button>
            </div>

            <!-- Aksi massal -->
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkAll">
                <label class="form-check-label" for="checkAll">Pilih semua</label>
              </div>
              <div class="btn-group btn-group-sm">
                <button type="button" id="massDoneBtn" class="btn btn-success" disabled>
                  <i class="bi bi-check2-all me-1"></i>Tandai Selesai
                </button>
                <button type="button" id="massUndoneBtn" class="btn btn-warning" disabled>
                  <i class="bi bi-arrow-counterclockwise me-1"></i>Batal Selesai
                </button>
                <button type="button" id="massDeleteBtn" class="btn btn-danger" disabled>
                  <i class="bi bi-trash me-1"></i>Hapus
                </button>
              </div>
            </div>

            <!-- Daftar tugas -->
            <ul id="todoList" class="list-group"></ul>

            <p id="emptyState" class="text-center text-muted mt-4 mb-0">
              <i class="bi bi-inbox fs-1 d-block"></i>
              Belum ada tugas. Tambahkan tugas pertama kamu!
            </p>
          </div>

          <div class="card-footer text-muted small d-flex justify-content-between">
            <span id="stats">0 tugas</span>
            <span id="selectedCount"></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
